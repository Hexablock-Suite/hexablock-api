      <h1>The application core and its extension axes</h1>
      <svg

        <title id="ext1overview-title">HexaBlock API extensibility overview</title>
        <desc id="ext1overview-desc">
          Extensibility diagram of the API showing the UseCase contract and the use cases in the
          center, with five extension axes around them: drivers, HTTP controllers and Drizzle
          repositories in layer 3, aspects in layer 2 (Q12), and level validators per variant in
          layer 1. Each driver and each Drizzle adapter has its own line for each port that it
          implements, and DrizzleLeaderboardReader implements GlobalBoardReader and LevelBoardReader
          (#218). PerformanceStopwatch implements the Stopwatch port, which LoggingAspect reads for
          the duration of each call (#181). The aspects frame holds UseCaseAspect, LoggingAspect and
          AuthorizationAspect (#180), each with the stereotype «aspect», and UseCaseAspect carries
          «abstract» «aspect» (#182). No line starts or ends on a dashed frame. UseCase carries only
          the interface stereotype. UpdateLevelsUseCase holds LevelRepository through a use arrow
          levels 1, and LevelValidators holds LevelValidator through a use arrow entries 0..*. A
          dashed frame labelled Aggregate encloses the LevelDefinition root alone. The footnote says
          that every input port binds UseCase, that LevelDefinition keeps its fields private, that
          FitSection and SortSection are value objects, that LeaderboardEntry is a response type of
          layer 2 and that Standing is a value object of layer 1, that a new variant with level
          files adds a section DTO and leaves the core unchanged, and it names the DTO mappers and
          the operations of LevelRepository that other views draw.
        </desc>
