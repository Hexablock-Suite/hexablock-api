        <desc id="ext2variant-desc">
          Extensibility diagram of layer 1 showing what a new variant with level files adds: a
          section type bound to TSection of the LevelDefinition aggregate root, which checks its own
          shape and holds its rules, and a LevelValidator strategy that only picks that section
          type. The composition root registers the strategy for its gameId in the LevelValidators
          domain service, which creates each level. FitSection and SortSection are the existing
          cases, and the declared Fill section and validator are placeholders. FitLevelValidator
          finds the Topology of the level in Topologies, so a new topology adds one Topology class.
          A dashed frame labelled AGGREGATE encloses LevelDefinition and its section types.
