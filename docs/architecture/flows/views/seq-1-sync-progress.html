        <title id="seq1syncprogress-title">
          HexaBlock API sync progress use case · UML sequence diagram

        <desc id="seq1syncprogress-desc">
          Sequence diagram of one progress sync request. The HTTP request enters JwtAuthGuard, which
          verifies the token through the AuthenticateToken input port and answers 401 on a failed
          Result. ProgressController gets a SyncProgressRequest from ProgressDtoMapper and calls
          SyncProgressUseCase through the SyncProgress input port. The use case finds the
          PlayerProgress through DrizzleProgressRepository, creates it when it is missing, reads the
          instant from SystemClock, records the score and each LevelResult, and saves the aggregate.
          The controller turns the PlayerProgress into a ProgressDto, which is the HTTP response.
