        <title id="seq3updatelevels-title">
          HexaBlock API update levels use case · UML sequence diagram
        </title>
        <desc id="seq3updatelevels-desc">
          Sequence diagram of one level update request. JwtAuthGuard verifies the token through the
          AuthenticateToken input port and answers 401 on a failed Result. LevelsController turns
          each LevelDto into a level with LevelDtoMapper and calls UpdateLevelsUseCase through the
          UpdateLevels input port. For each level, LevelValidators finds the LevelValidator strategy
          of its gameId, which checks the section shape and the rules. With no problem, the use case
          saves the levels through DrizzleLevelRepository; otherwise it returns a failed Result, and
          the controller answers with the error body that LevelDtoMapper builds.
        </desc>
