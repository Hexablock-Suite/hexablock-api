        <title id="seq3updatelevels-title">
          HexaBlock API update levels use case · UML sequence diagram
        </title>
        <desc id="seq3updatelevels-desc">
          Sequence diagram of one level update request. JwtAuthGuard verifies the token through the
          AuthenticateToken input port and answers 401 on a failed Result. LevelsController turns
          the body into an UpdateLevelsRequest with LevelDtoMapper and calls the UpdateLevels input
          port. AuthorizationAspect answers it first: an account outside LevelEditors gets a failed
          Result of kind not-a-level-editor in a break fragment, and the controller answers 403;
          otherwise the aspect calls UpdateLevelsUseCase and returns its Result unchanged (#180).
          For each level, the LevelValidators domain service finds the LevelValidator strategy of
          its gameId with GameId.equals(); the strategy picks the section type, the section checks
          its own shape and rules, and LevelValidators builds the level. With no problem, the use
          case saves each level with LevelUpdater.update(gameId, levelId, change), the role of the
          LevelRepository port that it holds (#193): DrizzleLevelRepository opens one transaction,
          locks the gameId and the levelId, and the change asks the incoming level:
          level.decideReplace(stored) decides the version rule of S3-10 over the stored state,
          absent, valid or broken (#174). Otherwise the use case returns a failed Result, and the
          controller answers a 400 whose details LevelDtoMapper writes. A note on the strategy gives
          the Fit path: FitLevelValidator finds the Topology of the level in Topologies, and
          FitSection checks A5 on it; a topology with no entry gives unknown-topology. The same note
          gives the Sort path: SortLevelValidator asks SortSection.of(raw) to check the radius, the
          goals, the source and the stars. The footnote names the LevelOrder, LevelVersion and
          Coordinate values that the request carries, and GetLevels, which only calls
          LevelLister.list(). The footnote also says that LevelDefinition is an entity and the
          aggregate root of one level with private fields, that FitSection and SortSection are value
          objects, and that LevelValidator and its validators form the Strategy pattern.
        </desc>

          LevelUpdater.update(): UpdateLevelsUseCase holds only LevelUpdater, its role of the
          LevelRepository port (#193), and AppModule binds that port to DrizzleLevelRepository. The
          LevelValidator lifeline is
        </text>
        <text
          x="24"
          y="1306"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          the strategy that LevelValidators finds with GameId.equals() for the gameId of the level:
          FitLevelValidator or SortLevelValidator. It picks the section
        </text>
        <text
          x="24"
          y="1322"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          type, the section checks its own shape and holds its rules, and LevelValidators builds the
          level with LevelDefinition.of(), so no unchecked level exists.
        </text>
        <text
          x="24"
          y="1338"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          The use case saves nothing while any level has a problem (API-FR-04). Then it calls
          update() once per level, and each level is saved in its own transaction (#80).
        </text>
        <text
          x="24"
          y="1354"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          A lower version fails in update() with older-version, and the 400 lists it. flows.md holds
          the class view with the same names and the routes.
        </text>
        <text
          x="24"
          y="1370"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          LevelDtoMapper builds the LevelOrder and the LevelVersion of each level, and
          FitSection.of() builds one Coordinate per cell. Part 1, view 5 draws these value objects.
        </text>
        <text
          x="24"
          y="1386"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          GetLevels has no sequence of its own: GetLevelsUseCase only calls LevelLister.list()
          («Other use cases» in flows.md).
        </text>
        <text
          x="24"
          y="1402"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          LevelDefinition is an «entity» and the «aggregate root» of one level, and it keeps its
          fields private. FitSection and SortSection are value objects.
        </text>
        <text
          x="24"
          y="1418"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          LevelValidator and its validators (FitLevelValidator, SortLevelValidator) form the
          Strategy pattern.
        </text>
        <text
          x="24"
          y="1434"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          AuthorizationAspect checks the UserId of the request before the use case runs; an account
          outside LevelEditors gets a 403, and the API saves nothing (#145, #180, decision 18).
        </text>
        <text
          x="24"
          y="1450"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          LevelDtoMapper checks the body first, so a malformed body gets a 400 for any account.
          LoggingAspect wraps the aspect and is not drawn (Part 3, view 4).
        </text>
