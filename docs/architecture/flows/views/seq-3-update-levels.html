        <title id="seq3updatelevels-title">
          HexaBlock API update levels use case · UML sequence diagram
        </title>
        <desc id="seq3updatelevels-desc">
          Sequence diagram of one level update request. JwtAuthGuard verifies the token through the
          AuthenticateToken input port and answers 401 on a failed Result. LevelsController turns
          the body into an UpdateLevelsRequest with LevelDtoMapper and calls UpdateLevelsUseCase
          through the UpdateLevels input port. For each level, the LevelValidators domain service
          finds the LevelValidator strategy of its gameId with GameId.equals(); the strategy picks
          the section type, the section checks its own shape and rules, and LevelValidators builds
          the level. With no problem, the use case saves each level with
          LevelRepository.update(gameId, levelId, change): DrizzleLevelRepository opens one
          transaction, locks the gameId and the levelId, and the change runs stored.accepts(level)
          on the stored copy (S3-10). Otherwise the use case returns a failed Result, and the
          controller answers a 400 whose details LevelDtoMapper writes. A note on the strategy gives
          the Fit path: FitLevelValidator finds the Topology of the level in Topologies, and
          FitSection checks A5 on it; a topology with no entry gives unknown-topology. The same note
          gives the Sort path: SortLevelValidator asks SortSection.of(raw) to check the radius, the
          goals, the source and the stars. The footnote names the LevelOrder, LevelVersion and
          Coordinate values that the request carries, and GetLevels, which only calls
          LevelRepository.list(). The footnote also says that LevelDefinition is an entity and the
          aggregate root of one level with private fields, that FitSection and SortSection are value
          objects, and that LevelValidator and its validators form the Strategy pattern.
        </desc>
