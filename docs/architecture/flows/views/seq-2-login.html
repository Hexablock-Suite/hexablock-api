      <h1>Login: one sign-in request through the four layers</h1>

        <title id="seq2login-title">HexaBlock API login use case · UML sequence diagram</title>
        <desc id="seq2login-desc">
          Sequence diagram of one sign-in request. The HTTP request enters AuthController with no
          token, and the controller calls LoginUseCase through the Login input port. The use case
          finds the User through DrizzleUserRepository. When the user is missing, the use case asks
          ScryptPasswordHasher for one check against a dummy hash, returns a failure, and the
          controller answers 401. Otherwise the use case asks the User if the password matches, and
          the User passes its own hash to ScryptPasswordHasher. When the password does not match,
          the use case returns a failure and the controller answers 401. Otherwise JwtTokenIssuer
          issues a SessionToken, and the controller answers with a TokenDto.
        </desc>
