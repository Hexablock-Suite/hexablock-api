        <desc id="seq2login-desc">
          Sequence diagram of one sign-in request. The HTTP request enters AuthController with no
          token, and the controller calls LoginUseCase through the Login input port. The use case
          finds the User through DrizzleUserRepository. When the user is missing, or when
          ScryptPasswordHasher says that the password does not match, the use case returns a failure
          and the controller answers 401. Otherwise JwtTokenIssuer issues a SessionToken, and the
          controller answers with a TokenDto.
        </desc>
