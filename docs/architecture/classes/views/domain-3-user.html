      <h1>User: one aggregate root and its credential values</h1>
      <svg

        <title id="domain3user-title">HexaBlock API user entity · UML class diagram</title>
        <desc id="domain3user-desc">
          Class diagram of layer 1 showing the User aggregate root, which holds a UserId, a Username
          and a PasswordHash value object in private fields, and the Password value object, the
          plain text that a new user chooses and that the API never stores. User.register() and
          User.restore() build a user, snapshot() gives a UserState, a read-only copy of its state,
          and passwordMatches() asks the PasswordVerifier interface to check a typed password
          against the hash of the user. Each value object keeps its value private and delivers it to
          a receiver with deliverTo(); Username also delivers its key.
        </desc>

          User is an aggregate root (decision 16): two users are the same user when they have the
          same UserId. Its repository serves sign-up and sign-in.
        </text>
        <text
          x="24"
          y="704"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          Its three fields are private value objects, equal by value. The constructor is private:
          register() creates a new user, and restore() builds a stored one again.
        </text>
        <text
          x="24"
          y="720"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          snapshot() gives a UserState, a read-only copy of the state (Memento). Only the border
          reads it: UserRowMapper for the row, and JwtTokenIssuer for the token subject.
        </text>
        <text
          x="24"
          y="736"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          passwordMatches() passes the hash of the user to a PasswordVerifier, so no use case reads
          the hash. PasswordVerifier is an interface of the domain. The PasswordHasher
        </text>
        <text
          x="24"
          y="752"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          port of layer 2 extends it (Part 2, view 4), and its adapter does the check. Username.key
          is the name in lower case; two names with the same key are the same name for
        </text>
        <text
          x="24"
          y="768"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          uniqueness. Username and Password check their own limits in create(). Password is the
          plain text that a new user chooses. RegisterUseCase creates it and hashes it
        </text>
        <text
          x="24"
          y="784"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          through PasswordHasher, and User keeps only the PasswordHash. Sign-in asks
          Password.isTooLong() before it hashes a text. Each value is private (decision 15):
        </text>
        <text
          x="24"
          y="800"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          deliverTo() and deliverKeyTo() deliver it to a receiver of layers 3 and 4: a mapper, a
          repository or an adapter. No operation returns it.
        </text>
