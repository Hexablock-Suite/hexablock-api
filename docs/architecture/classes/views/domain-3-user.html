      <h1>User: one aggregate root and its credential values</h1>
      <svg

        <title id="domain3user-title">HexaBlock API user entity · UML class diagram</title>
        <desc id="domain3user-desc">
          Class diagram of layer 1 showing the User aggregate root, which holds a UserId, a Username
          and a PasswordHash value object in private fields, and the Password value object, the
          plain text that a new user chooses and that the API never stores. User.register() and
          User.restore() build a user from the three value objects, deliverTo() gives them to a
          UserReceiver of the border, and passwordMatches() asks the PasswordVerifier interface to
          check a PasswordAttempt against the hash of the user. PasswordAttempt is the text that a
          player types at sign-in: it has no length rule, and it tells if it is longer than any
          password. Each value object keeps its value private and delivers it to a receiver with
          deliverTo(); Username also delivers its key. The factory of each value object returns a
          Result with the code of a broken rule, and PasswordAttempt.of() cannot fail. Username,
          Password and PasswordAttempt use the USERNAME_LENGTH and PASSWORD_LENGTH limits, two
          values of the bound class Range&lt;CharacterCount&gt;, which binds the type parameter T of
          the template Range&lt;T&gt; to the CharacterCount value object. Range&lt;T&gt; asks its
          values isAfter() and equals(), so no number order crosses it.
        </desc>

        <!-- Footnote -->
        <text
          x="24"

          fill="#5b6873"
          font-size="11"

        >
          User is an aggregate root (decision 16): an account signs in only with its own
          credentials. Two users are the same user when they have the same UserId.
        </text>
        <text
          x="24"
          y="1112"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          Its three fields are private value objects, equal by value. The constructor is private:
          register() creates a new user, and restore() builds a stored one again.
        </text>
        <text
          x="24"
          y="1128"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          deliverTo() gives the three values to a UserReceiver (Memento), and restore() takes them
          back. Only the border receives them: UserRowMapper for the row, JwtTokenIssuer for the
          token subject.
        </text>
        <text
          x="24"
          y="1144"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          passwordMatches() passes the hash of the user to a PasswordVerifier, so no use case reads
          the hash. PasswordVerifier is an interface of the domain. The PasswordHasher
        </text>
        <text
          x="24"
          y="1160"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          port of layer 2 extends it (Part 2, view 4), and its adapter does the check. Username.key
          is the name in lower case; two names with the same key are the same name for
        </text>
        <text
          x="24"
          y="1176"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          uniqueness. Username and Password check their own limits in create(). Password is the
          plain text that a new user chooses. RegisterUseCase creates it and hashes it
        </text>
        <text
          x="24"
          y="1192"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          through PasswordHasher, and User keeps only the PasswordHash. PasswordAttempt is the text
          that a player types at sign-in: it has no length rule,
        </text>
        <text
          x="24"
          y="1208"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          so a wrong password of any length costs one check. Sign-in asks isLongerThanAnyPassword()
          before any hash work. Its text is an ECMAScript private field,
        </text>
        <text
          x="24"
          y="1224"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          so no log and no JSON shows it. Each value is private (decision 15): deliverTo() and
          deliverKeyTo() deliver it to a mapper, a repository or an adapter.
        </text>
        <text
          x="24"
          y="1240"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          No operation returns it. Each factory returns a Result with the code of a broken rule;
          PasswordAttempt.of() cannot fail, so it returns the value itself.
        </text>
        <text
          x="24"
          y="1256"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          Each length limit is a Range&lt;CharacterCount&gt; (#99): USERNAME_LENGTH (3 to 32) and
          PASSWORD_LENGTH (8 to 128). The bound class binds T of the template Range&lt;T&gt; to
          CharacterCount.
        </text>
        <text
          x="24"
          y="1272"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          Range&lt;T&gt; asks its values isAfter() and equals() of Ordered&lt;T&gt;, which
          CharacterCount implements, so no number order crosses the range. Range.of() takes only the
          two bounds.
        </text>
        <text
          x="24"
          y="1288"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          CharacterCount counts code points, so an emoji is one character. Username, Password and
          PasswordAttempt count their text with CharacterCount.ofText(); the view draws no line for
          it.
        </text>
