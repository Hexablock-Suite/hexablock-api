        <title id="flow3updatelevels-title">
          HexaBlock API update levels use case · UML class diagram
        </title>
        <desc id="flow3updatelevels-desc">
          Cross-layer class diagram of the update levels use case. In layer 3, JwtAuthGuard holds
          the AuthenticateToken input port, LevelsController holds the UpdateLevels input port and
          uses LevelDtoMapper, and DrizzleLevelRepository implements LevelRepository and holds
          LevelValidators through a use arrow validators 1. The adapter shows list(), holds(gameId,
          levelId), findFor(gameId, results) and update(gameId, levelId, change). In layer 2,
          LevelRepository extends LevelUpdater, the role whose update(gameId, levelId, change)
          UpdateLevelsUseCase calls, and three more roles that view 2.3 draws (#193).
          UpdateLevelsUseCase implements UpdateLevels and holds the LevelUpdater role and
          LevelValidators, and AuthorizationAspect, which carries the stereotype «aspect» (#182),
          holds LevelEditors and wraps the UpdateLevels port; UseCaseAspect declares the wrapped
          port, so view 2.1 draws that line (#180). In layer 1, the LevelValidators domain service
          holds one LevelValidator strategy per gameId in a list of entries and creates each
          LevelDefinition aggregate root; FitLevelValidator and SortLevelValidator implement
          LevelValidator and pick their section type. FitLevelValidator holds Topologies and gives
          FitSection the Topology of the level. A dashed frame labelled Aggregate marks the boundary
          of LevelDefinition; views 2 and 5 of Part 1 draw its members. The footnote says that a
          level that fails its check leaves the stored levels unchanged, that each save asks
          decideReplace() of the incoming level (S3-10, #174), that FitSection and SortSection are
          value objects of the aggregate of LevelDefinition, that LevelValidator and its validators
          form the Strategy pattern, and that AppModule binds UpdateLevels to
          LoggingAspect(AuthorizationAspect(UpdateLevelsUseCase)), so an account outside
          LevelEditors gets a 403 after LevelDtoMapper has checked the body.
        </desc>
