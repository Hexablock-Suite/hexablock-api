        <title id="flow3updatelevels-title">
          HexaBlock API update levels use case · UML class diagram
        </title>
        <desc id="flow3updatelevels-desc">
          Cross-layer class diagram of the update levels use case. In layer 3, JwtAuthGuard holds
          the AuthenticateToken input port, LevelsController holds the UpdateLevels input port and
          uses LevelDtoMapper, and DrizzleLevelRepository implements LevelRepository and holds
          LevelValidators through a use arrow validators 1. In layer 2, UpdateLevelsUseCase
          implements UpdateLevels and holds the LevelRepository port and LevelValidators. In layer
          1, the LevelValidators domain service holds one LevelValidator strategy per gameId in a
          list of entries and creates each LevelDefinition aggregate root; FitLevelValidator and
          SortLevelValidator implement LevelValidator and pick their section type. FitLevelValidator
          holds Topologies and gives FitSection the Topology of the level. A dashed frame labelled
          Aggregate marks the boundary of LevelDefinition; views 2 and 5 of Part 1 draw its members.
          The footnote says that a level that fails its check leaves the stored levels unchanged,
          that FitSection and SortSection are value objects of the aggregate of LevelDefinition, and
          that LevelValidator and its validators form the Strategy pattern.
        </desc>
