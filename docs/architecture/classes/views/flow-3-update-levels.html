        <desc id="flow3updatelevels-desc">
          Cross-layer class diagram of the update levels use case. In layer 3, JwtAuthGuard holds
          the AuthenticateToken input port, LevelsController holds the UpdateLevels input port and
          uses LevelDtoMapper, and DrizzleLevelRepository implements LevelRepository. In layer 2,
          UpdateLevelsUseCase implements UpdateLevels and holds the LevelRepository port and
          LevelValidators. In layer 1, LevelValidators aggregates its LevelValidator strategies, a
          Strategy registry by gameId; FitLevelValidator and SortLevelValidator implement
          LevelValidator, which checks a LevelDefinition.
