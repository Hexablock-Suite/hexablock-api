        <title id="uc1contract-title">HexaBlock API use case contract · UML class diagram</title>
        <desc id="uc1contract-desc">
          Class diagram of layer 2 showing the generic UseCase interface, the contract that every
          input port binds, the SyncProgress input port that binds it, the use case that implements
          it, and the UseCaseAspect decorator with LoggingAspect and AuthorizationAspect, which view
          3 details (#180). Each aspect box carries the stereotype «aspect», the dashed reference
          box of AuthorizationAspect too, and UseCaseAspect carries «abstract» «aspect» (#182).
          UseCaseAspect joins the UseCase that it wraps with a hollow diamond on its own side,
          labelled decorate and 1 (class of 2026-11-23). Since Q12 the aspects live in layer 2, and
          LoggingAspect writes to the Logger port and reads the Stopwatch port before and after each
          call, so the one entry of the call carries its duration (#181); an optional function gives
          it extra entries from a success, such as the broken level rows of GetLevels (#219). Its
          TError type parameter extends { readonly kind: string }, and every problem type of an
          input port has a kind. A footnote names LevelsController, LeaderboardController,
          LevelDtoMapper and LeaderboardDtoMapper of layer 3, which call and translate the level and
          leaderboard input ports.
        </desc>

          LoggingAspect reads the Stopwatch port before and after each call, and the one entry of
          the call carries elapsedMs, its duration (#181).
        </text>
        <text
          x="24"
          y="844"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          SyncProgress returns a Result with the PlayerProgress, and ProgressDtoMapper in layer 3
          turns it into the response DTO (Part 3, view 5).
        </text>
        <text
          x="24"
          y="860"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          GetLevels returns Result&lt;readonly LevelDefinition[], never&gt; and UpdateLevels
          Result&lt;void, UpdateLevelsError&gt;; AppModule wraps both in LoggingAspect (#81, #219).
        </text>
        <text
          x="24"
          y="876"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          GetGlobalLeaderboard binds UseCase with TRequest → GameId and TResponse →
          Result&lt;GlobalLeaderboard, never&gt;. GetLevelLeaderboard binds
        </text>
        <text
          x="24"
          y="892"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          it with TRequest → LevelBoardQuery and TResponse → Result&lt;LevelLeaderboard,
          UnknownLevel&gt;. AppModule wraps both in LoggingAspect (#83, #218).
        </text>
        <text
          x="24"
          y="908"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          LevelsController and LeaderboardController call these four ports, and LevelDtoMapper and
          LeaderboardDtoMapper translate their DTOs (Part 3, views 3 and 5).
        </text>
        <text
          x="24"
          y="924"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          LoggingAspect asks TError for a kind, and every problem type has one: LoginProblem is {
          kind: 'invalid-credentials' } and TokenProblem { kind: 'invalid-token' } (#104).
        </text>
        <text
          x="24"
          y="940"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          UseCase is the contract that every input port binds. The aspects of the Decorator frame
          wrap it.
        </text>
        <text
          x="24"
          y="956"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          AuthorizationAspect (Part 2, view 3) lets only a level editor reach UpdateLevels.
          AppModule puts it inside LoggingAspect, so the log sees each rejected attempt (#180).
        </text>
