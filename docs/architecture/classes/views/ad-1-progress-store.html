        <title id="ad1progressstore-title">
          HexaBlock API progress persistence · UML class diagram
        </title>
        <desc id="ad1progressstore-desc">
          Class diagram of layers 3, 2 and 1 showing DrizzleProgressRepository, which implements
          ProgressRepository, and DrizzleLeaderboardReader, which implements both board reader ports
          of layer 2, GlobalBoardReader and LevelBoardReader (#218), and ProgressRowMapper, which
          turns the rows of both progress tables into the PlayerProgress aggregate and back. The
          mapper receives the parts of the aggregate through PlayerProgressReceiver, an interface of
          layer 1, and builds the aggregate again from those parts with restore().
          DrizzleProgressRepository finds and updates one progress by its ProgressKey and receives
          the userId and the gameId of the key through ProgressKeyReceiver, another interface of
          layer 1, for its lock key and its SQL filters. DrizzleLeaderboardReader filters by gameId
          and level, sums the totals of each Standing and adds no order. A footnote says that
          LeaderboardEntry is a response type of layer 2 with no tactical stereotype and that
          Standing is a value object of layer 1.
        </desc>
