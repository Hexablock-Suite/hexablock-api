      <h1>Wiring: the composition root binds each port to one adapter</h1>

        <title id="ad4wiring-title">HexaBlock API wiring · UML class diagram</title>
        <desc id="ad4wiring-desc">
          Class diagram of layers 4, 3 and 2 showing AppModule, the composition root, binding the
          Clock, PasswordHasher and TokenIssuer ports to SystemClock, ScryptPasswordHasher and
          JwtTokenIssuer of layer 3 in its bindings compartment. The compartment lists all twenty
          bindings of app.module.ts: the drivers and the adapters on the left, among them the four
          Drizzle adapters over DATABASE and LevelValidators, and the input ports and the filter on
          the right. LoggingAspect wraps SyncProgress, UpdateLevels and GetLeaderboard. The
          AuthorizeLevelEditor input port binds to AuthorizeLevelEditorUseCase with the LevelEditors
          of LEVEL_EDITOR_IDS (#145); the Nest container creates each adapter once.
        </desc>
