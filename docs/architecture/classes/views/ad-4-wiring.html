      <h1>Wiring: the composition root binds each port to one adapter</h1>
      <svg

        <title id="ad4wiring-title">HexaBlock API wiring · UML class diagram</title>
        <desc id="ad4wiring-desc">
          Class diagram of layers 4, 3 and 2 showing AppModule, the composition root, binding the
          Clock, PasswordHasher and TokenIssuer ports to SystemClock, ScryptPasswordHasher and
          JwtTokenIssuer of layer 3 in its bindings compartment. The compartment lists the bindings
          of app.module.ts: the drivers and the adapters on the left, among them the Drizzle
          adapters over DATABASE and LevelValidators, with the two board reader tokens that alias
          one DrizzleLeaderboardReader (#218), and the input ports and the filter on the right.
          LoggingAspect wraps RegisterUser, Login, AuthenticateToken, SyncProgress, GetProgress,
          GetLevels, UpdateLevels, GetGlobalLeaderboard and GetLevelLeaderboard (#170); for
          GetLevels it also logs each broken level row (#219). On UpdateLevels, AuthorizationAspect
          sits inside LoggingAspect and holds the LevelEditors of LEVEL_EDITOR_IDS, so the log sees
          each rejected attempt (#145, #180); the Nest container creates each adapter once.
          STOPWATCH binds to PerformanceStopwatch, which each LoggingAspect reads for the duration
          of a call (#181).
        </desc>
