      <h1>Progress: one aggregate per user and gameId, and the values that rank a leaderboard</h1>
      <svg

        <title id="domain1progress-title">
          HexaBlock API progress entities · UML class diagram
        </title>
        <desc id="domain1progress-desc">
          Class diagram of layers 2 and 1. In layer 1, PlayerProgress, the aggregate root, holds its
          identity as a ProgressKey value object of a UserId and a GameId, keeps its high score as a
          Score value object and the instant of its last sync as a SyncInstant value object,
          delivers its parts to a PlayerProgressReceiver with deliverTo(), is built again by
          restore() from those parts and keeps its LevelResult values, each one with the
          isBetterThan order of DS-4. The Standing value object holds the totals of a player in one
          game, a Stars, a LevelsCompleted, a Moves and an ElapsedTime, and the isBetterThan order
          of S3-03. In layer 2, the LeaderboardEntry response type names the player by UserId and
          holds the value that ranks the player: a LevelResult, a Score or a Standing. ProgressKey
          takes the UserId and the GameId built, compares them in equals() and delivers both to a
          ProgressKeyReceiver with deliverTo(). GameId, Score, SyncInstant and UserId keep their
          value private and deliver it to a receiver with deliverTo(). Each of their factories
          returns a Result with the code of a broken rule. LevelResult keeps its four value objects
          private, takes them built in of(), and delivers all four to a LevelResultReceiver with
          deliverTo().
        </desc>

        >
          PlayerProgress is the aggregate root, one per ProgressKey: a userId and a gameId. It keeps
          the level results of its game, and recordLevel() is the only way to add one.
        </text>
        <text
          x="24"
          y="1040"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          ProgressRepository saves the whole aggregate; its adapter splits it into the progress and
          level_results tables (DS-5). recordLevel() keeps the best result of a level (DS-4).
        </text>
        <text
          x="24"
          y="1056"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          recordScore() keeps the highest Score, as Score.isHigherThan() tells. GameId is an open
          value: hexa-lines, hexa-fit, hexa-sort and hexa-merge.
        </text>
        <text
          x="24"
          y="1072"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          updatedAt is the SyncInstant of the last sync: the use case passes it from the Clock port,
          each record takes it, and isLaterThan() keeps updatedAt from moving back (decision 3).
        </text>
        <text
          x="24"
          y="1088"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          PlayerProgress refers to User by id: its ProgressKey holds a UserId, not a User. View 3
          draws User and its values, and view 4 draws the values of LevelResult.
        </text>
        <text
          x="24"
          y="1104"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          PlayerProgress has no getter: deliverTo() gives its parts to a PlayerProgressReceiver
          (Memento), and restore() builds it again from those parts. Part 3, view 1, draws the
          receiver.
        </text>
        <text
          x="24"
          y="1120"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          GameId, Score, SyncInstant and UserId keep their value private (decision 15): deliverTo()
          delivers it to layers 3 and 4. Each factory returns a Result with the code of a broken
          rule.
        </text>
        <text
          x="24"
          y="1136"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          ProgressKey holds the UserId and the GameId of a progress (#107). of() takes both built
          and cannot fail, so it returns the key; deliverTo() gives both to a ProgressKeyReceiver.
        </text>
        <text
          x="24"
          y="1152"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          LevelResult keeps its four values private: of() takes the four value objects built by
          layer 3, and deliverTo() gives all four to a LevelResultReceiver in one call.
        </text>
        <text
          x="24"
          y="1168"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          Standing holds the totals of a player in one game. isBetterThan() ranks more stars, then
          more levels completed, then fewer moves, then less time (S3-03).
        </text>
        <text
          x="24"
          y="1184"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          LeaderboardEntry is a response type of layer 2 with no rule of its own. TResult is
          LevelResult on a level board, Score for Lines and Merge, and Standing for Fit and Sort.
        </text>
        <text
          x="24"
          y="1200"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          LeaderboardReader only filters and sums. GetLeaderboardUseCase orders the entries with
          these comparisons of the domain (decision 2).
        </text>
