      <h1>Progress: one aggregate per user and gameId, and the values that rank a leaderboard</h1>
      <svg

        <title id="domain1progress-title">
          HexaBlock API progress entities · UML class diagram
        </title>
        <desc id="domain1progress-desc">
          Class diagram of layers 2 and 1. In layer 1, PlayerProgress, the aggregate root keyed by
          userId and gameId, holds a UserId and a GameId, keeps its high score as a Score value
          object, delivers its parts to a PlayerProgressReceiver with deliverTo(), is built again by
          restore() on a progress that start() made and keeps its LevelResult values, each one with
          the isBetterThan order of DS-4. The Standing value object holds the totals of a player in
          one game, a Stars, a LevelsCompleted, a Moves and an ElapsedTime, and the isBetterThan
          order of S3-03. In layer 2, the LeaderboardEntry response type names the player by UserId
          and holds the value that ranks the player: a LevelResult, a Score or a Standing. GameId,
          Score and UserId keep their value private and deliver it to a receiver with deliverTo().
          Each of their factories returns a Result with the code of a broken rule. LevelResult keeps
          its four value objects private, takes them built in of(), and delivers all four to a
          LevelResultReceiver with deliverTo().
        </desc>

        </text>
        <text

          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"

          ProgressRepository saves the whole aggregate; its adapter splits it into the progress and
          level_results tables (DS-5). recordLevel() keeps the best result of a level (DS-4).
        </text>
        <text

          font-size="11"

          recordScore() keeps the highest Score, as Score.isHigherThan() tells; the use case passes
          the instant from the Clock port. GameId is an open value: hexa-lines, hexa-fit, hexa-sort
          and hexa-merge.
        </text>
        <text
          x="24"
          y="980"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          PlayerProgress refers to User by id: it holds a UserId, not a User. View 3 draws User and
          its values, and view 4 draws the values of LevelResult.
        </text>
        <text
          x="24"
          y="996"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          PlayerProgress has no getter: deliverTo() gives its parts to a PlayerProgressReceiver
          (Memento), and restore() builds it again on a progress that start() made. Part 3, view 1,
          draws the receiver.
        </text>
        <text
          x="24"
          y="1012"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          GameId, Score and UserId keep their value private (decision 15): deliverTo() delivers it
          to layers 3 and 4. Each factory returns a Result with the code of a broken rule.
        </text>
        <text
          x="24"
          y="1028"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          LevelResult keeps its four values private: of() takes the four value objects built by
          layer 3, and deliverTo() gives all four to a LevelResultReceiver in one call.
        </text>
        <text
          x="24"
          y="1044"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          Standing holds the totals of a player in one game. isBetterThan() ranks more stars, then
          more levels completed, then fewer moves, then less time (S3-03).
        </text>
        <text
          x="24"
          y="1060"
          fill="#5b6873"
          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          LeaderboardEntry is a response type of layer 2 with no rule of its own. TResult is
          LevelResult on a level board, Score for Lines and Merge, and Standing for Fit and Sort.
        </text>
        <text

          font-size="11"
          font-family="'IBM Plex Sans', sans-serif"
        >
          LeaderboardReader only filters and sums. GetLeaderboardUseCase orders the entries with
          these comparisons of the domain (decision 2).
        </text>
