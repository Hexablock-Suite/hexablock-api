        <title id="uc3levels-title">HexaBlock API level use cases · UML class diagram</title>
        <desc id="uc3levels-desc">
          Class diagram of layers 2 and 1 showing GetLevelsUseCase and UpdateLevelsUseCase over the
          LevelRepository port, which lists the levels and updates one level per call under a lock
          of its gameId and levelId; its change asks the incoming level, whose decideReplace()
          decides the version rule of S3-10 over the stored state (#174); UpdateLevelsUseCase also
          holds the LevelValidators domain service and returns a Result whose InvalidLevels failure
          holds one problem per broken level with its gameId and levelId, so a level that fails its
          check is never saved and no exception reaches the HTTP layer. GetLevelsUseCase takes no
          request and has no expected failure; it gives the valid levels and the broken rows apart,
          and holds no logger: LoggingAspect wraps it and logs each broken row (#147, #219).
          AuthorizationAspect, which carries the stereotype «aspect» (#182), wraps UpdateLevels and
          holds the LevelEditors value object of layer 1, the user ids of the configuration; it
          fails with not-a-level-editor for any other user id of the request before the use case
          runs, so an empty list lets no account update (#145, #180). A footnote names
          LevelDtoMapper, which builds the UpdateLevelsRequest, and LevelRowMapper, which restores
          each stored row through LevelValidators.
        </desc>
