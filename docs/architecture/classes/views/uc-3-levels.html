        <title id="uc3levels-title">HexaBlock API level use cases · UML class diagram</title>
        <desc id="uc3levels-desc">
          Class diagram of layers 2 and 1 showing GetLevelsUseCase and UpdateLevelsUseCase over the
          LevelRepository port, the one repository of the LevelDefinition aggregate, which extends
          four role interfaces, one per use case (#193): GetLevelsUseCase holds LevelLister, whose
          list() lists the levels, and UpdateLevelsUseCase holds LevelUpdater, whose update()
          updates one level per call under a lock of its gameId and levelId; LevelHolder and
          LevelFinder are the roles of the two use cases of view 2.2; its change asks the incoming
          level, whose decideReplace() decides the version rule of S3-10 over the stored state
          (#174); UpdateLevelsUseCase also holds the LevelValidators domain service and returns a
          Result whose InvalidLevels failure holds one problem per broken level with its gameId and
          levelId, so a level that fails its check is never saved and no exception reaches the HTTP
          layer. GetLevelsUseCase takes no request and has no expected failure; it gives the valid
          levels and the broken rows apart, and holds no logger: LoggingAspect wraps it and logs
          each broken row (#147, #219). AuthorizationAspect wraps UpdateLevels and holds the
          LevelEditors value object of layer 1, the user ids of the configuration; it fails with
          not-a-level-editor for any other user id of the request before the use case runs, so an
          empty list lets no account update (#145, #180). A footnote names LevelDtoMapper, which
          builds the UpdateLevelsRequest, and LevelRowMapper, which restores each stored row through
          LevelValidators.
        </desc>

        </text>
