        <title id="ad5httpmappers-title">HexaBlock API HTTP mappers · UML class diagram</title>
        <desc id="ad5httpmappers-desc">
          Class diagram of layers 3 and 1 showing AuthDtoMapper, ProgressDtoMapper and
          LevelDtoMapper in src/adapters/http: AuthController uses AuthDtoMapper to build the
          RegisterUserRequest and the LoginRequest from the body and to build the token and user
          answers, ProgressController uses ProgressDtoMapper to turn PlayerProgress into the
          response DTO through the parts that the aggregate delivers to a PlayerProgressReceiver,
          LevelsController uses LevelDtoMapper to build the update request from the body, to turn
          each LevelDefinition into a LevelDto and to write the error details of a failed Result,
          and LeaderboardController uses LeaderboardDtoMapper to build the LeaderboardQuery from the
          path and to turn the Leaderboard into the LeaderboardDto.
