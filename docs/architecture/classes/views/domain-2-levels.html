        <title id="domain2levels-title">HexaBlock API level schema · UML class diagram</title>
        <desc id="domain2levels-desc">
          Class diagram of layer 1 showing the LevelDefinition aggregate root with private fields:
          its common part and a section of type TSection, which the class bounds by LevelSection,
          bound to the FitSection or the SortSection value object. The LevelValidators domain
          service holds one LevelValidator strategy per gameId in a list of entries, finds it with
          GameId.equals() and creates each level. FitLevelValidator and SortLevelValidator implement
          the LevelValidator interface and pick their section type. SortLevelValidator only picks
          SortSection, which holds its rules. FitLevelValidator holds Topologies, finds the Topology
          of the level and picks FitSection, which checks A5 on that Topology. A dashed frame
          labelled Aggregate encloses LevelDefinition and its section types, FitSection and
          SortSection. LevelDefinition.decideReplace(stored), called on the incoming copy, decides
          the version rule of S3-10 over the stored state (#174). A dashed frame labelled TOPOLOGY
          groups the Topology interface, with its three rules holds(), turn() and move(), its three
          implementations HexTopology, SquareTopology and TriangleTopology, and the Topologies
          domain service, which holds one Topology per topologyId and finds it with
          TopologyId.equals(). A triangle move keeps the orientation of the cell (#229).
        </desc>
