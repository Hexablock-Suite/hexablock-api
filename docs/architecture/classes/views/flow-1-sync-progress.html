        <desc id="flow1syncprogress-desc">
          Cross-layer class diagram of the sync progress use case. In layer 3, JwtAuthGuard holds
          the AuthenticateToken input port, ProgressController holds the SyncProgress input port and
          uses ProgressDtoMapper, and DrizzleProgressRepository implements ProgressRepository. In
          layer 4, SystemClock implements Clock. In layer 2, SyncProgressUseCase implements
          SyncProgress, takes a SyncProgressRequest and holds the ProgressRepository and Clock
          ports. In layer 1, the use case updates the PlayerProgress aggregate, which keeps its
          LevelResult values.
        </desc>
