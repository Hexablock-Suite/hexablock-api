        <title id="uc2progress-title">HexaBlock API progress use cases · UML class diagram</title>
        <desc id="uc2progress-desc">
          Class diagram of layer 2 showing SyncProgressUseCase, which holds the ProgressRepository
          port for the whole progress aggregate and the Clock port, and GetLeaderboardUseCase, which
          holds the LeaderboardReader port and the LevelRepository port. Before the board of a
          level, the use case asks LevelRepository.holds() whether the definitions hold the level,
          and fails with UnknownLevel when they do not (#146). The reader only filters and sums, and
          the use case orders the entries with the comparisons of the domain. Each progress use case
          joins the userId and the gameId of its request in a ProgressKey, and ProgressRepository
          finds and updates one progress by that key. A footnote names LeaderboardController and
          LeaderboardDtoMapper of layer 3, which call GetLeaderboard and translate its query and
          answer, and says that LeaderboardEntry is a response type of layer 2 with no tactical
          stereotype.
        </desc>
