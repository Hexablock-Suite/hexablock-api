        <title id="ad2levelstore-title">
          HexaBlock API level and user persistence · UML class diagram
        </title>
        <desc id="ad2levelstore-desc">
          Class diagram of layers 3, 2 and 1 showing DrizzleLevelRepository, which holds
          LevelValidators and uses LevelRowMapper, and DrizzleUserRepository with UserRowMapper,
          implementing the LevelRepository and UserRepository ports. LevelRepository and
          DrizzleLevelRepository both show the four operations list(), holds(gameId, levelId),
          findFor(gameId, results) and update(gameId, levelId, change). LevelRepository declares
          none of them itself: it extends four role interfaces, LevelLister, LevelHolder,
          LevelFinder and LevelUpdater, one per use case, which view 2.3 draws (#193).
          LevelRowMapper restores each stored row through the strategy that LevelValidators finds
          for its gameId, so each LevelDefinition is valid; a row that no strategy accepts is a
          broken row with its reason and its stored version: list() gives it apart, findFor() gives
          no level for it, and update() passes it to the change as the broken state (#147), whose
          change asks decideReplace() of the incoming level (#174).
        </desc>
