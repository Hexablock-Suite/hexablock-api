          Class diagram of layers 3, 2 and 1 showing DrizzleLevelRepository, which holds
          LevelValidators and uses LevelRowMapper, and DrizzleUserRepository with UserRowMapper,
          implementing the LevelRepository and UserRepository ports. LevelRowMapper restores each
          stored row through the strategy that LevelValidators finds for its gameId, so each
          LevelDefinition is valid; a row that no strategy accepts is a broken row with its reason
          and its stored version (#147).
