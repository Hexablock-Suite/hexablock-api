<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HexaBlock API Clean layers · concentric view</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --color-paper: #f3f5f6;
        --color-ink: #17212a;
        --color-muted: #5b6873;
        --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
        --font-serif: 'Instrument Serif', serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-paper);
        color: var(--color-ink);
        padding: 3rem 2rem;
      }
      .frame {
        max-width: 1240px;
        margin: 0 auto;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: 0.5rem;
      }
      h1 {
        font-family: var(--font-serif);
        font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        margin-bottom: 1.5rem;
      }
      svg {
        width: 100%;
        min-width: 900px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="eyebrow">Layers · View 1 of 1</p>
      <h1>The four Clean layers as concentric rings</h1>
      <svg
        viewBox="0 0 1040 924"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="rings-title rings-desc"
      >
        <title id="rings-title">HexaBlock API Clean layers · concentric view</title>
        <desc id="rings-desc">
          Four concentric rings: layer 1, the entities in src/domain, in the yellow centre; layer 2,
          the use cases and their ports in src/application, in purple; layer 3, the interface
          adapters in src/adapters, in light blue; layer 4, the frameworks and drivers in
          src/infrastructure, in dark blue on the outside. Arrows on both sides point toward the
          centre, because every source dependency points inward.
        </desc>
        <defs>
          <marker
            id="rings-arrow"
            markerWidth="10"
            markerHeight="8"
            refX="9"
            refY="4"
            orient="auto"
            markerUnits="userSpaceOnUse"
          >
            <path d="M0,0 L9,4 L0,8" fill="none" stroke="#5b6873" stroke-width="1" />
          </marker>
        </defs>
        <rect width="100%" height="100%" fill="#f3f5f6" />
        <!-- Rings: outer to inner, so each inner ring paints over the one around it -->
        <circle
          cx="520"
          cy="420"
          r="380"
          fill="#cfdcf3"
          stroke="rgba(30,58,138,0.50)"
          stroke-width="1"
        />
        <circle
          cx="520"
          cy="420"
          r="290"
          fill="#e2ebf8"
          stroke="rgba(29,78,216,0.40)"
          stroke-width="1"
        />
        <circle
          cx="520"
          cy="420"
          r="200"
          fill="#efe7f8"
          stroke="rgba(126,34,206,0.40)"
          stroke-width="1"
        />
        <circle
          cx="520"
          cy="420"
          r="110"
          fill="#f9f4dc"
          stroke="rgba(180,83,9,0.45)"
          stroke-width="1"
        />
        <!-- Dependencies: one arrow per boundary on each side, toward the centre -->
        <line
          x1="202"
          y1="460"
          x2="258"
          y2="460"
          stroke="#5b6873"
          stroke-width="1"
          marker-end="url(#rings-arrow)"
        />
        <line
          x1="292"
          y1="460"
          x2="348"
          y2="460"
          stroke="#5b6873"
          stroke-width="1"
          marker-end="url(#rings-arrow)"
        />
        <line
          x1="382"
          y1="460"
          x2="438"
          y2="460"
          stroke="#5b6873"
          stroke-width="1"
          marker-end="url(#rings-arrow)"
        />
        <line
          x1="838"
          y1="460"
          x2="782"
          y2="460"
          stroke="#5b6873"
          stroke-width="1"
          marker-end="url(#rings-arrow)"
        />
        <line
          x1="748"
          y1="460"
          x2="692"
          y2="460"
          stroke="#5b6873"
          stroke-width="1"
          marker-end="url(#rings-arrow)"
        />
        <line
          x1="658"
          y1="460"
          x2="602"
          y2="460"
          stroke="#5b6873"
          stroke-width="1"
          marker-end="url(#rings-arrow)"
        />
        <!-- Ring labels and contents -->
        <text
          x="520"
          y="68"
          fill="#1e3a8a"
          font-size="8"
          font-weight="500"
          font-family="'IBM Plex Mono', monospace"
          text-anchor="middle"
          letter-spacing="0.18em"
        >
          LAYER 4 · FRAMEWORKS AND DRIVERS
        </text>
        <text
          x="520"
          y="86"
          fill="#17212a"
          font-size="10"
          font-family="'IBM Plex Sans', sans-serif"
          text-anchor="middle"
        >
          src/infrastructure/ · NestJS · Drizzle connection
        </text>
        <text
          x="520"
          y="740"
          fill="#17212a"
          font-size="10"
          font-family="'IBM Plex Sans', sans-serif"
          text-anchor="middle"
        >
          AppModule, the composition root · SystemClock
        </text>
        <text
          x="520"
          y="755"
          fill="#17212a"
          font-size="10"
          font-family="'IBM Plex Sans', sans-serif"
          text-anchor="middle"

          JWT and scrypt drivers · logging and timing aspects (Q12)
        </text>
        <text
          x="520"
          y="158"
          fill="#1d4ed8"

        <text

          src/application/ · six use cases
        </text>
        <text

          y="560"
          fill="#17212a"
          font-size="10"
          font-family="'IBM Plex Sans', sans-serif"

        </text>
        <text

          y="575"
          fill="#17212a"
          font-size="10"

          text-anchor="middle"

        </text>
        <text

        </text>
        <text

        </text>
        <!-- Legend -->
        <line x1="24" y1="840" x2="1016" y2="840" stroke="rgba(23,33,42,0.10)" stroke-width="0.8" />
        <text

          fill="#5b6873"

          font-family="'IBM Plex Mono', monospace"
          letter-spacing="0.18em"
        >
          LEGEND
        </text>
        <rect
          x="24"
          y="870"
          width="20"
          height="12"
          rx="2"
          fill="#cfdcf3"
          stroke="rgba(30,58,138,0.50)"
          stroke-width="1"
        />
        <text
          x="52"
          y="879"
          fill="#5b6873"
          font-size="8.5"
          font-family="'IBM Plex Sans', sans-serif"
        >
          Layer 4 · frameworks and drivers
        </text>
        <rect
          x="236"
          y="870"
          width="20"
          height="12"
          rx="2"
          fill="#e2ebf8"
          stroke="rgba(29,78,216,0.40)"
          stroke-width="1"
        />
        <text
          x="264"
          y="879"
          fill="#5b6873"
          font-size="8.5"
          font-family="'IBM Plex Sans', sans-serif"
        >
          Layer 3 · interface adapters
        </text>
        <rect
          x="448"
          y="870"
          width="20"
          height="12"
          rx="2"
          fill="#efe7f8"
          stroke="rgba(126,34,206,0.40)"
          stroke-width="1"
        />
        <text
          x="476"
          y="879"
          fill="#5b6873"
          font-size="8.5"
          font-family="'IBM Plex Sans', sans-serif"
        >
          Layer 2 · use cases
        </text>
        <rect
          x="660"
          y="870"
          width="20"
          height="12"
          rx="2"
          fill="#f9f4dc"
          stroke="rgba(180,83,9,0.45)"
          stroke-width="1"
        />
        <text
          x="688"
          y="879"
          fill="#5b6873"
          font-size="8.5"
          font-family="'IBM Plex Sans', sans-serif"
        >
          Layer 1 · entities
        </text>
        <line
          x1="24"
          y1="902"
          x2="52"
          y2="902"
          stroke="#5b6873"
          stroke-width="1"
          marker-end="url(#rings-arrow)"
        />
        <text
          x="60"
          y="906"
          fill="#5b6873"
          font-size="8.5"
          font-family="'IBM Plex Sans', sans-serif"
        >
          Arrow · a source dependency; every one points toward the centre
        </text>
        <text
          x="448"
          y="906"
          fill="#5b6873"
          font-size="8.5"
          font-family="'IBM Plex Sans', sans-serif"
        >
          Yellow, purple and blue follow the course; layers 3 and 4 together are its blue
          infrastructure, in two shades
        </text>
      </svg>
    </div>
  </body>
</html>
