# Local Postgres for development. Start it with `docker compose up -d`.
# DATABASE_URL=postgres://hexablock:hexablock@localhost:5432/hexablock
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hexablock
      POSTGRES_PASSWORD: hexablock
      POSTGRES_DB: hexablock
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hexablock -d hexablock']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
