name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Repeats the commit-msg hook, so a bypassed hook still fails here.
      - name: commitlint
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - run: pnpm verify

  # Runs the advisory-lock suites of DrizzleProgressRepository.update() and
  # DrizzleLevelRepository.update() on a throwaway Postgres (rule
  # R-database-harness). PGlite runs one session, so only a real server shows
  # two updates that wait for one lock. Each suite migrates the fresh database
  # first, so the files run one at a time.
  postgres-lock:
    name: postgres-lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      HB_TEST_PG_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run test/integration/drizzle-progress-repository.concurrency.spec.ts test/integration/drizzle-level-repository.concurrency.spec.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=postgres-lock.json
      # A skipped or missing suite would pass without testing its lock, so the
      # job fails unless both files ran and every test of each file passed.
      - name: fail when the suite was skipped
        run: jq -e '(.testResults | length) == 2 and all(.testResults[]; (.assertionResults | length) > 0 and all(.assertionResults[]; .status == "passed"))' postgres-lock.json

  # Verifies the pact from the client main branch against this commit (spec S9).
  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORT: '3000'
      BACKEND_URL: http://localhost:3000
      PACT_DO_NOT_TRACK: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: start the API
        # The provider composition: AppModule on in-memory PGlite plus the
        # state-change endpoint of the pact provider states (#151). It runs
        # from the sources with the example values, so it needs no build and
        # no Postgres. The production start has no state-change endpoint.
        run: nohup node --env-file=.env.example scripts/contract/start-provider.js > api.log 2>&1 &
      - name: wait for /v1/health
        run: |
          for _ in $(seq 1 30); do
            curl -fsS "$BACKEND_URL/v1/health" && exit 0
            sleep 1
          done
          cat api.log
          exit 1
      - run: pnpm contract:verify
      - name: show the API log
        if: failure()
        run: cat api.log
